name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filters.outputs.backend }}
      frontend: ${{ steps.filters.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filters
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'agent-backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'agent-frontend/**'
              - '.github/workflows/ci.yml'

  test-backend:
    name: Test Backend
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
          cache-dependency-path: 'agent-backend/pnpm-lock.yaml'

      - name: Enable Corepack and prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install dependencies (backend)
        working-directory: agent-backend
        run: pnpm install --frozen-lockfile

      - name: Run lint (backend)
        working-directory: agent-backend
        run: pnpm run lint --if-present
        continue-on-error: true

      - name: Run tests (backend)
        working-directory: agent-backend
        run: pnpm test
        env:
          NODE_ENV: test

  build-and-test-frontend:
    name: Build & Test Frontend
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'agent-frontend/pnpm-lock.yaml'

      - name: Enable Corepack and prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install dependencies (frontend)
        working-directory: agent-frontend
        run: pnpm install --frozen-lockfile

      - name: Run lint (frontend)
        working-directory: agent-frontend
        run: pnpm run lint --if-present
        continue-on-error: true

      - name: Run tests (frontend)
        working-directory: agent-frontend
        run: pnpm test || true

      - name: Build frontend
        working-directory: agent-frontend
        run: pnpm build || true

  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [detect-changes, test-backend, build-and-test-frontend]
    if: always()
    steps:
      - name: Verify job results
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" || "$GITHUB_EVENT_NAME" == "push" ]]; then
            echo "Checks completed";
          fi
