name: Test (backend & frontend)

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install dependencies (backend)
        run: cd agent-backend && pnpm install

      - name: Run tests (backend)
        run: cd agent-backend && pnpm test

      - name: Validate OpenAPI spec compilation
        run: cd agent-backend && pnpm run validate:openapi

      - name: Install dependencies (deep-agent)
        run: cd deep-agent && pnpm install

      - name: Run tests (deep-agent)
        run: cd deep-agent && pnpm test

      - name: Install dependencies (frontend)
        run: if [ -d "agent-frontend" ]; then cd agent-frontend && pnpm install --frozen-lockfile; fi

      - name: Check formatting (frontend)
        run: if [ -d "agent-frontend" ]; then cd agent-frontend && pnpm run format:check; fi

      - name: Check SDK docs coverage (exports vs docs)
        run: node sdk/scripts/check-docs-coverage.mjs
