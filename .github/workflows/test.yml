name: Test (backend & frontend)

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install dependencies (backend)
        run: cd agent-backend && pnpm install

      - name: Run tests (backend)
        run: cd agent-backend && pnpm test

      - name: Validate OpenAPI spec compilation
        run: cd agent-backend && pnpm run validate:openapi

      - name: Install dependencies (deep-agent)
        run: cd deep-agent && pnpm install

      - name: Run tests (deep-agent)
        run: cd deep-agent && pnpm test

      - name: Install dependencies (sdk)
        run: cd sdk && pnpm install --frozen-lockfile

      - name: Typecheck (sdk)
        run: cd sdk && pnpm typecheck

      - name: Run tests (sdk)
        run: cd sdk && pnpm test

      - name: Install dependencies (runtime)
        run: cd runtime && pnpm install --frozen-lockfile

      - name: Typecheck (runtime)
        run: cd runtime && pnpm typecheck

      - name: Run tests (runtime)
        run: cd runtime && pnpm test

      - name: Install dependencies (frontend)
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Check formatting (frontend)
        run: cd frontend && pnpm run format:check

      - name: Set up Python (sdk-python)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sdk-python with dev extras
        run: cd sdk-python && pip install -e ".[dev]"

      - name: Run tests (sdk-python)
        run: cd sdk-python && python -m pytest

      - name: Check SDK docs coverage (exports vs docs)
        run: node sdk/scripts/check-docs-coverage.mjs
