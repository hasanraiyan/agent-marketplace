name: Test (backend, frontend & SDK)

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install dependencies (backend)
        run: cd agent-backend && pnpm install

      - name: Run tests (backend)
        run: cd agent-backend && pnpm test

      - name: Validate OpenAPI spec compilation
        run: cd agent-backend && pnpm run validate:openapi

      - name: Install dependencies (deep-agent)
        run: cd deep-agent && pnpm install

      - name: Run tests (deep-agent)
        run: cd deep-agent && pnpm test

      - name: Install dependencies (frontend)
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Check formatting (frontend)
        run: cd frontend && pnpm run format:check

  sdk:
    # Matrix over every SDK package in sdk/ — add a new row when a package
    # lands (e.g. sdk/adapters/*, sdk/react, ...). No hardcoded per-package steps.
    runs-on: ubuntu-latest
    strategy:
      # The three SDK packages are independent — a failure in one shouldn't
      # cancel the others.
      fail-fast: false
      matrix:
        include:
          - dir: typescript
            toolchain: node
          - dir: runtime
            toolchain: node
          - dir: adapters/express
            toolchain: node
          - dir: python
            toolchain: python

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
        if: matrix.toolchain == 'node'

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'
          cache-dependency-path: 'sdk/${{ matrix.dir }}/pnpm-lock.yaml'
        if: matrix.toolchain == 'node'

      - name: Install dependencies (sdk/${{ matrix.dir }})
        run: cd sdk/${{ matrix.dir }} && pnpm install --frozen-lockfile
        if: matrix.toolchain == 'node'

      - name: Typecheck (sdk/${{ matrix.dir }})
        run: cd sdk/${{ matrix.dir }} && pnpm typecheck
        if: matrix.toolchain == 'node'

      - name: Lint (sdk/${{ matrix.dir }})
        run: cd sdk/${{ matrix.dir }} && pnpm lint
        if: matrix.toolchain == 'node'

      - name: Run tests (sdk/${{ matrix.dir }})
        run: cd sdk/${{ matrix.dir }} && pnpm test
        if: matrix.toolchain == 'node'

      - name: Express 4 compatibility suite (sdk/adapters/express)
        run: cd sdk/adapters/express && pnpm test:express4
        if: matrix.dir == 'adapters/express'

      - name: Check SDK docs coverage (exports vs docs)
        run: node sdk/typescript/scripts/check-docs-coverage.mjs
        if: matrix.dir == 'typescript'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
        if: matrix.toolchain == 'python'

      - name: Install with dev extras (sdk/${{ matrix.dir }})
        run: cd sdk/${{ matrix.dir }} && pip install -e ".[dev]"
        if: matrix.toolchain == 'python'

      - name: Lint (sdk/${{ matrix.dir }})
        run: cd sdk/${{ matrix.dir }} && python -m ruff check .
        if: matrix.toolchain == 'python'

      - name: Run tests (sdk/${{ matrix.dir }})
        run: cd sdk/${{ matrix.dir }} && python -m pytest
        if: matrix.toolchain == 'python'
