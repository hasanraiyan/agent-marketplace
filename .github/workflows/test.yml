name: Test (backend, frontend & SDK)

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install dependencies (backend)
        run: cd agent-backend && pnpm install

      - name: Run tests (backend)
        run: cd agent-backend && pnpm test

      - name: Validate OpenAPI spec compilation
        run: cd agent-backend && pnpm run validate:openapi

      - name: Install dependencies (deep-agent)
        run: cd deep-agent && pnpm install

      - name: Run tests (deep-agent)
        run: cd deep-agent && pnpm test

      - name: Install dependencies (frontend)
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Check formatting (frontend)
        run: cd frontend && pnpm run format:check

  sdk:
    # Greenfield JS-only: 4 SDKs (sdk/typescript, runtime, adapters, react).
    # Python is old/unmaintained (out-of-scope), logger/ui/devtools are internal/deprecated.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: typescript
            toolchain: node
          - dir: runtime
            toolchain: node
          - dir: adapters
            toolchain: node
          - dir: react
            toolchain: node

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'pnpm'
          cache-dependency-path: 'sdk/${{ matrix.dir }}/pnpm-lock.yaml'

      - name: Install dependencies (sdk/${{ matrix.dir }})
        run: cd sdk/${{ matrix.dir }} && pnpm install --frozen-lockfile

      - name: Typecheck (sdk/${{ matrix.dir }})
        run: cd sdk/${{ matrix.dir }} && pnpm typecheck

      - name: Lint (sdk/${{ matrix.dir }})
        run: cd sdk/${{ matrix.dir }} && pnpm lint

      - name: Run tests (sdk/${{ matrix.dir }})
        run: cd sdk/${{ matrix.dir }} && pnpm test

      - name: Express 4 compatibility suite (adapters)
        run: cd sdk/adapters && pnpm test:express4
        if: matrix.dir == 'adapters'

  docs:
    # Greenfield docs checks — JS-only, 4 SDKs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Install platform deps (for search index)
        run: pnpm --dir platform install --frozen-lockfile

      - name: Check version consistency (registry ↔ package.json)
        run: node platform/scripts/check-version-consistency.mjs

      - name: Check docs coverage (exports ↔ types.mdx)
        run: node platform/scripts/check-docs-coverage.mjs

      - name: Validate TypeDoc configs (dry-run)
        run: |
          for pkg in typescript runtime adapters react; do
            echo "--- typedoc dry-run: $pkg ---"
            npx --yes typedoc --options sdk/$pkg/typedoc.json --help > /dev/null
          done
          echo "TypeDoc configs OK (help check)"

      - name: Generate TypeDoc JSON and MDX (sdk)
        run: |
          for pkg in typescript runtime adapters react; do
            npx --yes typedoc --options sdk/$pkg/typedoc.json
          done
          node platform/scripts/typedoc-to-mdx.mjs --all
          node platform/scripts/typedoc-resources.mjs

      - name: Build search index and verify no drift
        run: |
          node platform/scripts/build-search.mjs
          git diff --exit-code -- platform/public/search-index.json platform/content/docs/search-index.json || (echo "::error::search-index.json drift — run node platform/scripts/build-search.mjs and commit"; exit 1)
