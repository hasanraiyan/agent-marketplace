[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "persona-agent-sdk"
version = "0.1.3"
description = "Python SDK for the Persona.ai Developer Platform API. Server-side only — never bundle into client-side/browser code."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Raiyan Hasan" }]
keywords = ["persona", "persona.ai", "sdk", "ag-ui", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/hasanraiyan/agent-marketplace/tree/feat/ai/sdk-python"
Repository = "https://github.com/hasanraiyan/agent-marketplace"
Issues = "https://github.com/hasanraiyan/agent-marketplace/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/personaai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# These modules define a `list()` method; combined with `from __future__
# import annotations`, mypy resolves bare `list[X]` elsewhere in the same
# file to that method instead of the builtin. `typing.List` sidesteps it.
"src/personaai/resources/knowledge.py" = ["UP006", "UP035"]
"src/personaai/resources/providers.py" = ["UP006", "UP035"]

[tool.mypy]
# mypy 2.x can no longer type-check against a 3.9 target (min supported is
# 3.10) even though the package itself still supports 3.9 (requires-python
# above) — nothing in this codebase is 3.10+-only, so this is just a mypy
# capability limit, not a real runtime gap.
python_version = "3.10"
strict = true
files = ["src"]
