include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # `if (x != null) x else y` reads more clearly at a glance than the
    # newer `?x` null-aware-element syntax for this package's conditional
    # widget-list entries — same rationale as persona_agent_client's
    # analysis_options.yaml.
    use_null_aware_elements: false

